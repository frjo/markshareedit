{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "New document" %} — MarkShareEdit{% endblock %}

{% block content %}
  <section>
    <h1>{% trans "New document" %}</h1>
    <form method="post">
      {% csrf_token %}
      <div>
        <label for="title">{% trans "Title" %}</label>
        <input
          type="text"
          id="title"
          name="title"
          maxlength="200"
          autofocus
          placeholder="{% trans 'Untitled' %}"
        >
      </div>
      <button type="submit">{% trans "Create" %}</button>
      <a href="{% url 'document_list' %}">{% trans "Cancel" %}</a>
    </form>
  </section>
{% endblock %}
